[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sahcr"
version = "0.1.0"
description = "Structure-Aware Hybrid Code Retrieval: Design and Implementation of a Local Semantic Retrieval System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "streamlit>=1.33.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sahcr = "sahcr.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sahcr"]
